name: Release

# Собирает подписанный APK и публикует его в Releases. Оттуда его берёт Obtainium.
# Запуск: вручную (Actions → Release → Run workflow, поле «version», например 0.0.1)
# или отправкой метки v0.0.1. Из сессии Claude метки отправить нельзя (git-прокси
# отвечает 403), поэтому основной путь ручной. При ручном запуске метку создаёт
# последний шаг: если сборка упала раньше, номер версии не сгорает.

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без буквы v, например 0.0.1 (собирается текущий main)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # создание релиза

jobs:
  release:
    name: Сборка и выпуск
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ID: io.github.dumahuch.pogodaapp
      KEY_ALIAS: pogodaapp # постоянное имя ключа, не секрет
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Версия
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error title=Не та ветка::Ручной выпуск собирается только из main, а запущен из $GITHUB_REF"
              exit 1
            fi
            NAME="$INPUT_VERSION"
          else
            NAME="$GITHUB_REF_NAME"
          fi
          VERSION="${NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error title=Неверная версия::'$NAME' должно выглядеть как 1.2.3"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))" >> "$GITHUB_ENV"

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: .github/scripts/prepare_keystore.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      - name: Тесты скриптов выпуска
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Тесты и сборка релиза
        env:
          APP_VERSION: ${{ env.VERSION }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --console=plain --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build-release.log

      - name: Разбор APK
        id: inspect
        run: |
          python3 .github/scripts/inspect_apk.py app/build/outputs/apk/release/app-release.apk \
            --package "$APP_ID" \
            --version-name "$VERSION" --version-code "$VERSION_CODE" \
            --min-sdk 36 --target-sdk 36 --require-signature --require-v3

      - name: Сверка ключа с прошлым выпуском
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ steps.inspect.outputs.cert_sha256 }}
        run: python3 .github/scripts/key_continuity.py --current-tag "$TAG" --cert-sha256 "$CERT_SHA256"

      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ steps.inspect.outputs.cert_sha256 }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PogodaApp-$VERSION.apk"
          {
            if [ -f "release-notes/$VERSION.md" ]; then cat "release-notes/$VERSION.md"; else echo "PogodaApp $VERSION"; fi
            echo
            echo "Отпечаток ключа подписи (SHA-256): \`$CERT_SHA256\`"
          } > release-body.md
          # От метки: метка уже есть и обязана существовать (--verify-tag).
          # От ручного запуска: метку создаёт сам релиз на собранном коммите.
          args=(--title "PogodaApp $VERSION" --notes-file release-body.md)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            args+=(--target "$GITHUB_SHA")
          else
            args+=(--verify-tag)
          fi
          gh release create "$TAG" "dist/PogodaApp-$VERSION.apk" "${args[@]}"

      - name: Причина падения
        if: failure()
        run: python3 .github/scripts/annotate_failure.py build-release.log

      - name: Удаление ключа с машины
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
