name: Release

# Собирает подписанный APK и публикует его в Releases. Оттуда его берёт Obtainium.
# Запуск только вручную: Actions → Release → Run workflow, поле «version», например 0.0.1.
# Запуск по метке убран: метка на любом коммите давала бы подписанный выпуск в обход
# проверки «только main». Метку создаёт последний шаг: если сборка упала раньше,
# номер версии не сгорает.
# Ключ подписи лежит в секретах среды `release` (Settings → Environments). Среда требует
# одобрения Димы и пускает только ветку main, поэтому другие ветки до ключа не доберутся.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без буквы v, например 0.0.1 (собирается текущий main)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # создание релиза

jobs:
  release:
    name: Сборка и выпуск
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release # секреты подписи выдаются только после одобрения
    env:
      APP_ID: io.github.dumahuch.pogodaapp
      KEY_ALIAS: pogodaapp # постоянное имя ключа, не секрет
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # токен с правом записи не остаётся в папке на время сборки

      - name: Версия
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error title=Не та ветка::Выпуск собирается только из main, а запущен из $GITHUB_REF"
            exit 1
          fi
          NAME="$INPUT_VERSION"
          VERSION="${NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error title=Неверная версия::'$NAME' должно выглядеть как 1.2.3"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))" >> "$GITHUB_ENV"

      - name: Номер версии по порядку
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/version_step.py --version "$VERSION" --current-tag "$TAG"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Тесты скриптов выпуска
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      # Тесты идут без секретов: ключа на машине ещё нет, пока работает код тестов и зависимостей.
      - name: Тесты
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          set -o pipefail
          ./gradlew --console=plain --stacktrace testDebugUnitTest 2>&1 | tee build-release.log

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: .github/scripts/prepare_keystore.sh

      - name: Сборка релиза
        env:
          APP_VERSION: ${{ env.VERSION }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --console=plain --stacktrace assembleRelease 2>&1 | tee -a build-release.log

      - name: Разбор APK
        id: inspect
        run: |
          python3 .github/scripts/inspect_apk.py app/build/outputs/apk/release/app-release.apk \
            --package "$APP_ID" \
            --version-name "$VERSION" --version-code "$VERSION_CODE" \
            --min-sdk 36 --target-sdk 36 --require-signature --require-v3 \
            --forbid-dex-string PogodaRefresh \
            --forbid-dex-string "обновление протягиванием" \
            --allow-permission android.permission.INTERNET \
            --allow-permission android.permission.ACCESS_COARSE_LOCATION \
            --allow-permission android.permission.ACCESS_FINE_LOCATION \
            --allow-permission android.permission.POST_NOTIFICATIONS \
            --allow-permission android.permission.ACCESS_NETWORK_STATE \
            --allow-permission android.permission.RECEIVE_BOOT_COMPLETED \
            --allow-permission android.permission.REQUEST_INSTALL_PACKAGES \
            --allow-permission android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION

      - name: Сверка ключа с прошлым выпуском
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ steps.inspect.outputs.cert_sha256 }}
        run: python3 .github/scripts/key_continuity.py --current-tag "$TAG" --cert-sha256 "$CERT_SHA256"

      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ steps.inspect.outputs.cert_sha256 }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PogodaApp-$VERSION.apk"
          {
            if [ -f "release-notes/$VERSION.md" ]; then cat "release-notes/$VERSION.md"; else echo "PogodaApp $VERSION"; fi
            echo
            echo "Отпечаток ключа подписи (SHA-256): \`$CERT_SHA256\`"
          } > release-body.md
          # Метку создаёт сам релиз на собранном коммите.
          gh release create "$TAG" "dist/PogodaApp-$VERSION.apk" \
            --title "PogodaApp $VERSION" --notes-file release-body.md --target "$GITHUB_SHA"

      - name: Причина падения
        if: failure()
        run: python3 .github/scripts/annotate_failure.py build-release.log

      - name: Удаление ключа с машины
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
