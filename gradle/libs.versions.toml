# Версии проверены 28.10.2026 по реестрам Google Maven и Maven Central (шаг 1: lifecycle, coroutines, org.json).
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
junit = "4.13.2"
lifecycle = "2.11.0"
kotlinxCoroutines = "1.11.0"
orgJson = "20260814"
haze = "2.1.0"
# Карта (0.8.0, 12.11.2026): версии по меткам на GitHub (maplibre-native android-v13.7.1, commons-compress rel/1.28.0);
# реестр Maven Central из сессии недоступен, наличие артефактов подтверждает сборка.
maplibre = "13.7.1"
commonsCompress = "1.28.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
# Размытие фона под стеклом (Haze 2.0: ядро и размытие в разных модулях). Версия 2.0.1 проверена 29.10.2026 по метке и истории изменений на GitHub
# (Compose 1.12.1, как наш BOM); реестр Maven Central из сессии недоступен, наличие артефактов подтверждает сборка.
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
# Карта: показ подложки и слоёв (MapLibre Native, лицензия BSD-2-Clause).
maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
# Распаковка файлов облачности DWD (bzip2; Apache Commons Compress, лицензия Apache 2.0).
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# Настоящая реализация org.json для модульных тестов (в android.jar она заглушка).
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
